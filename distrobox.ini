# Distrobox dev container for the SeasonEnded project.
#
# Base: Alpine 3.21 + Podman backend.
# The container shares the host network namespace, so services
# started on the host (postgres on 5432, mailpit on 8025) are
# reachable from inside the box as localhost.
#
# Create the container (run on your Linux host):
#   distrobox create --config distrobox.ini
# Enter the container:
#   distrobox enter seasonended
#
# Inside the container, start each app in its own terminal:
#   # backend
#   dotnet watch --project src/SeasonEnded.Api
#   # frontend
#   npm --prefix src/SeasonEnded.Web run dev
#   # tests
#   dotnet test SeasonEnded.sln
#   npm --prefix src/SeasonEnded.Web test
#
# Optional, start the backing services on the host (separate shell):
#   podman compose --env-file .env -f deploy/compose.yml up -d

[seasonended]
image=alpine:3.21
additional_packages=nodejs npm git bash build-base curl ca-certificates tzdata icu-libs krb5-libs libgcc libgomp libstdc++ libcrypto3 libssl3 zlib
init_hooks=curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh && chmod +x /tmp/dotnet-install.sh && /tmp/dotnet-install.sh --version 10.0.111 --install-dir /usr/local/share/dotnet && ln -sf /usr/local/share/dotnet/dotnet /usr/local/bin/dotnet && printf 'export DOTNET_ROOT=/usr/local/share/dotnet\nexport PATH=$PATH:$DOTNET_ROOT:$DOTNET_ROOT/tools:$HOME/.dotnet/tools\n' > /etc/profile.d/dotnet.sh && chmod +x /etc/profile.d/dotnet.sh
