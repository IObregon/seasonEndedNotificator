name: CI

on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/SeasonEnded.Web/package-lock.json
      - run: dotnet test SeasonEnded.sln --configuration Release
      - run: npm ci
        working-directory: src/SeasonEnded.Web
      - run: npm test
        working-directory: src/SeasonEnded.Web
      - run: npm run build
        working-directory: src/SeasonEnded.Web

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: docker compose -f deploy/compose.yml up --build --wait
      - name: Verify HTTPS routes
        run: |
          curl --fail -k --resolve season-ended.localhost:443:127.0.0.1 https://season-ended.localhost/
          test "$(curl --fail -k --resolve season-ended.localhost:443:127.0.0.1 https://season-ended.localhost/health/live)" = "Healthy"
          test "$(curl --fail -k --resolve season-ended.localhost:443:127.0.0.1 https://season-ended.localhost/health/ready)" = "Healthy"
      - name: Verify local email capture
        run: |
          curl --fail -k \
            --resolve season-ended.localhost:443:127.0.0.1 \
            --header "Content-Type: application/json" \
            --data '{"recipient":"viewer@example.test"}' \
            https://season-ended.localhost/api/dev/email-test
          message_id="$(curl --fail --silent http://localhost:8025/api/v1/messages | jq --raw-output '.messages[0].ID')"
          message="$(curl --fail --silent "http://localhost:8025/api/v1/message/${message_id}")"
          test "$(jq --raw-output '.To[0].Address' <<< "$message")" = "viewer@example.test"
          test "$(jq --raw-output '.Subject' <<< "$message")" = "Season Ended email check"
          test "$(jq --raw-output '.Text' <<< "$message")" = "Local email is working."
          test "$(jq --raw-output '.HTML' <<< "$message")" = '<p><strong>Local email is working.</strong></p>'
      - name: Verify readiness depends on PostgreSQL
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: |
          docker compose -f deploy/compose.yml stop postgres
          test "$(curl --silent -k --output /dev/null --write-out '%{http_code}' --resolve season-ended.localhost:443:127.0.0.1 https://season-ended.localhost/health/ready)" = "503"
          test "$(curl --silent -k --output /dev/null --write-out '%{http_code}' --resolve season-ended.localhost:443:127.0.0.1 https://season-ended.localhost/health/live)" = "200"
      - name: Verify production isolation
        env:
          POSTGRES_PASSWORD: ci-only-password
          APP_DOMAIN: example.com
        run: |
          docker compose -f deploy/compose.yml -f deploy/compose.production.yml config --format json > production-compose.json
          test "$(jq --raw-output '.services.api.environment.ASPNETCORE_ENVIRONMENT' production-compose.json)" = "Production"
          test "$(jq --raw-output '.services.mailpit // "absent"' production-compose.json)" = "absent"
      - name: Print logs
        if: failure()
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: docker compose -f deploy/compose.yml logs
      - name: Stop stack
        if: always()
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: docker compose -f deploy/compose.yml down --volumes

  build-and-push:
    needs: [test, compose-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: seasonended-api
            context: .
            dockerfile: src/SeasonEnded.Api/Dockerfile
          - image: seasonended-web
            context: .
            dockerfile: src/SeasonEnded.Web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            export GHCR_OWNER=${{ github.repository_owner }}
            export IMAGE_TAG=${{ github.sha }}
            export POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            export POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            export BOOTSTRAP_ADMIN_EMAIL=${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
            export TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            export TELEGRAM_BOT_USERNAME=${{ secrets.TELEGRAM_BOT_USERNAME }}
            export PUSH_PUBLIC_KEY=${{ secrets.PUSH_PUBLIC_KEY }}
            export PUSH_PRIVATE_KEY=${{ secrets.PUSH_PRIVATE_KEY }}
            export PUSH_SUBJECT=${{ secrets.PUSH_SUBJECT }}
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker compose -f deploy/compose.vps.yml pull
            docker compose -f deploy/compose.vps.yml up -d --wait
            docker image prune -f
