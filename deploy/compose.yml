name: season-ended

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seasonended}
      POSTGRES_USER: ${POSTGRES_USER:-seasonended}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: src/SeasonEnded.Api/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-seasonended};Username=${POSTGRES_USER:-seasonended};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: 1025
      Email__Smtp__UseTls: "false"
      Email__Smtp__FromAddress: notifications@season-ended.local
      Email__Smtp__FromName: Season Ended
      BootstrapAdmin__Email: admin@localhost
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__BotUsername: ${TELEGRAM_BOT_USERNAME:-}
      Telegram__WebhookSecret: ${TELEGRAM_WEBHOOK_SECRET:-}
      Push__PublicKey: ${PUSH_PUBLIC_KEY:-}
      Push__PrivateKey: ${PUSH_PRIVATE_KEY:-}
      Push__Subject: ${PUSH_SUBJECT:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health/ready | grep -q Healthy"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
